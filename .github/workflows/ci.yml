name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality-check:
    name: Quality check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.11
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Check package contents
        run: npm run pack:check

  smoke:
    name: Install the packed tarball and run the CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pack the package
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # `npm pack --dry-run` cannot catch a bin that fails to link, so install
      # the real tarball into a clean project and run the executable.
      - name: Install the tarball into a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/daldindev-agentic-skills-*.tgz

      - name: Run the installed executable
        run: |
          cd "$RUNNER_TEMP/smoke"
          test -x node_modules/.bin/agentic-skills
          ./node_modules/.bin/agentic-skills --version
          ./node_modules/.bin/agentic-skills --help | head -1
