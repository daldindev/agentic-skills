name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify the release tag matches the package and the changelog
        if: github.event_name == 'release'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"

          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi

          changelog_version="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          if [ "$changelog_version" != "$tag_version" ]; then
            echo "CHANGELOG.md's newest release is $changelog_version, not $tag_version" >&2
            exit 1
          fi

          # Entries still under [Unreleased] mean this commit is past the release it claims to be.
          if awk '/^## \[Unreleased\]/ { inside = 1; next } /^## \[/ { inside = 0 } inside && NF { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md still lists entries under [Unreleased]. Tag the commit that closes this release, not a later one." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run publish checks
        run: npm run release:check

      # A release published after the fact, or a workflow re-run, must not fail
      # on npm rejecting a version that is already there.
      - name: Check whether this version is already on npm
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping." >&2
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.published.outputs.already == 'false'
        run: npm publish --access public --provenance
